<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .confirmation-box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .success {
            color: #28a745;
            font-size: 18px;
            font-weight: bold;
        }
        .details {
            margin-top: 20px;
        }
        .details p {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="confirmation-box">
        <p class="success">✓ Confirmation Successful</p>
        <div class="details">
            <p><strong>Name:</strong> <span th:text="${customer.firstName} + ' ' + ${customer.lastName}"></span></p>
            <p><strong>Free Passes:</strong> <span th:text="${customer.freePasses}"></span></p>
            <p><strong>Postal Code:</strong> <span th:text="${customer.postalCode}"></span></p>
        </div>
    </div>
</body>
</html>
